name: Process PDF Comparison

on:
  repository_dispatch:
    types: process-pdf-update

jobs:
  process-pdf:
    runs-on: ubuntu-latest
    env:
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run PDF comparison
        run: node scripts/process-pdf.js
        env:
          INPUT_NAME: ${{ github.event.client_payload.name }}
          INPUT_OLD_URL: ${{ github.event.client_payload.old_url }}
          INPUT_NEW_URL: ${{ github.event.client_payload.new_url }}
